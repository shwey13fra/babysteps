# Observed run-to-run movement with every input held fixed.
#
# Why this file exists: a zero-tolerance threshold on a stochastic measure is
# not a gate, it is a lottery (ADR-048). Reporting a single-sample number with
# no n attached is how that goes unnoticed, so run.ts refuses to print a gate
# figure without the band beside it.
#
# RULES FOR EDITING
#   1. A band is only valid for the CONFIGURATION it was measured under. Change
#      the judge rubric, the golden set, the answer prompt or the corpus and the
#      affected bands must be re-measured. run.ts compares `measured_under`
#      against the live configuration and marks each band current or STALE in
#      the report; it never quotes a stale band as if it were current.
#   2. `depends_on` names the configuration components a band is sensitive to.
#      Be conservative: list a component unless the band provably cannot move
#      with it. A band wrongly marked current is worse than one marked stale.
#   3. Only completed, valid samples count. A partial run never does, however
#      suggestive its rows were.
#   4. `observed` is what was measured, verbatim. Never smooth it, never drop
#      the inconvenient sample.
#   5. When the MEASURE changes rather than the configuration, set
#      `invalidated_by` on the affected band and say why. `depends_on` cannot
#      express this: it answers "has something this band is sensitive to
#      moved", not "is this still the same quantity". A band may only be
#      RE-EXPRESSED in a new denominator without new samples when the rows
#      leaving it are deterministic across every existing sample, and the
#      evidence for that goes in the note (ADR-051).

version: 1

measured_under:
  golden: v1.8
  judge: judge.v4.md
  answer: answer.v2.md
  corpus: "2026-10"
  git: a2b4bba

samples:
  n: 3
  labels:
    - 2026-11-03-iter7-instrument-fixed
    - 2026-11-03-variance-2
    - 2026-11-03-variance-3
  note: >
    variance-3's shell was killed by the host at row 16 of 48 (memory pressure,
    not a run failure), but the tsx child process survived and completed all 48
    rows. Found on disk afterwards, 48/48 measured, $3.62, judge.v4 - a valid
    third sample under this configuration, so it counts under rule 3. Its
    report carries `git unknown` because the kill interrupted the sha lookup.

bands:
  retrieval_hit:
    observed: [23, 23, 23]
    movement: 0
    unit: hits
    # RE-EXPRESSED, not re-measured, under ADR-051: the scorable denominator
    # drops A-24 and A-26, whose every required element is unreachable.
    denominator: 28
    denominator_all: 30
    depends_on: [corpus, golden]
    rescoped_to:
      golden: v1.9
    rescoped_why: >-
      v1.8 -> v1.9 removed two ANSWER required ELEMENTS (A-02, A-16) and nothing
      else: the cell-by-cell migration reports exactly 2 differences, both in
      required_answer_elements. retrievalHit is computed from
      ground_truth_source and ground_truth_url, neither of which was touched on
      any row, and the retrieval exclusion set is derived from
      coverage-exclusions.yaml, which is unchanged and still matches v1.9
      (A-24 3/3, A-26 5/5). So this golden change provably cannot move this
      band, and marking it stale would print a warning known to be false.
    note: >
      Identical on all three samples, and no model judgement anywhere in the
      number. Query embeddings do drift - 21 of 48 rows returned a different
      topCosine, max delta 1.1e-4 - but retrievalHit was identical on all 48
      rows, and the row closest to the 0.43 refusal threshold (A-26, 0.4252)
      sits 0.0048 away, 42x the largest drift observed. This is the only gate
      figure trustworthy to the unit, which is why ADR-048 sends the next
      iteration here.

      RE-EXPRESSED under ADR-050 and ADR-051 from 23/30 to 23/28, with no new samples and
      none needed. The two rows leaving the denominator are deterministic
      misses across every existing sample, checked on disk rather than argued:
      A-24 and A-26 were retrievalHit false in iter7, variance-2 AND
      variance-3, with topCosine 0.3992 / 0.3992 / 0.3992 and 0.4251 / 0.4252
      / 0.4251 - both under the 0.43 floor, because the corpus holds nothing to
      retrieve for them. The numerator is untouched: neither row ever
      contributed a hit. So the movement of 0 hits carries over exactly, and
      the gate figure is 23/28 = 82.1% at n=3 against a bar of 80%.

  citation_validity:
    observed_numerator: [53, 49, 52]
    observed_denominator: [56, 52, 55]
    movement: 4
    unit: citations
    depends_on: [corpus, golden, answer]
    invalidated_by: >-
      ADR-049 changed how validity is computed - the cited chunk is resolved by
      (url, ref) rather than by url alone - so these three samples measured a
      different quantity. Not re-expressible: the fix moves the NUMERATOR
      (A-17 goes 0/3 to 3/3 at least), not just the denominator. Needs new
      samples.
    note: >
      Both halves move - the denominator spans 52 to 56, about 7% - yet the
      RATE is tight: 94.6, 94.2, 94.5%. So the gate is not noise-bound, it is
      genuinely short: the lower bound is 94.2% and needs to clear 95%. Three
      samples, three misses, each by one or two citations. Reported as a range
      with the lower bound tested, never to one decimal place (ADR-048).

  coverage_scorable:
    observed: [60, 62, 60]
    movement: 2
    unit: elements
    # RE-EXPRESSED 87 -> 85 under golden v1.9 (ADR-051's rule): the two removed
    # elements were measured UNCOVERED in all three samples - checked on disk,
    # not assumed - so the numerator is untouched and only the denominator
    # moves. The band stays STALE regardless, on `judge`: judge.v5 invalidated
    # it and that has not been re-measured.
    denominator: 85
    denominator_v1_8: 87
    depends_on: [corpus, golden, answer, judge]
    note: >
      60, 62, 60 - measured of 87 under golden v1.8, re-expressed of 85 under
      v1.9. Net movement 2, but the churn is larger than the net: between iter7
      and variance-2 alone, 7 elements moved across 7 rows, some up and some
      down. A change that moves scorable coverage by fewer than 4 elements is
      not evidence of anything and must not get an ADR claiming improvement
      (ADR-048). The gate needs 66 of 87, which is 64 of 85 - and the bar fell
      because two unmeetable elements left the set, which is not progress
      toward it.

  criticals:
    observed: [0, 1, 1]
    adjudicated: [0, 0, 0]
    movement: 1
    unit: criticals
    depends_on: [corpus, golden, answer, judge]
    note: >
      A-01's MuSchG §15 sentence, ruled a false positive and fixed in judge.v5
      (ADR-047), raised the critical in TWO of the three samples. That matters
      beyond this row: ADR-048 confirms a critical that is "reproducible across
      runs", and this one reproduced. Reproduction distinguishes a systematic
      judge error from a one-off, NOT a false positive from a true one - a
      biased instrument reproduces its own bias. Criterion (a) cannot stand
      alone for a judge-raised critical; the sentence still has to be read.
      Adjudicated is 0 on all three.

      RULED 2026-11-04, and ADR-048 is amended accordingly: "reproducible
      across runs" means observed in >=2 samples of the SAME COMMIT, and a
      critical seen once whose row re-verifies clean is recorded as a suspected
      instrument defect and investigated, not counted against the gate.
      Reproduction still never confirms a judge-raised critical on its own.

  refuse_rows:
    observed: [7, 7, 8]
    adjudicated: [7, 8, 8]
    movement: 1
    movement_row_identity: 3
    unit: rows
    denominator: 8
    depends_on: [corpus, golden, answer, judge]
    note: >
      Three samples, three different outcomes: R-06 failed in iter7, R-01 in
      variance-2, nothing in variance-3. So this gate was already passing a
      third of the time under judge.v4, and the count alone would have read as
      near-stable while the failing row changed every run. R-01's failure was
      the refusal_present false negative fixed in judge.v5, which is why
      adjudicated is 8/8 for variance-2. iter7's R-06 failure is NOT
      adjudicated away: it is a compound required element of the R-02/R-04
      family, a golden-set defect still open.
