# data/rules/german_federal.yaml
#
# Ten German-track timeline items. Schema: docs/f2b-birth-event-and-rules-addendum.md §2.
#
# EVERY rule here carries verified_on: null and source_status:
# needs_manual_verification. That is not an oversight and it is not laziness.
# These rules were authored from the project's own reference documents; nobody has
# yet opened the cited statute and confirmed that its text says what the YAML
# claims. Playbook Phase 1 VERIFY assigns exactly that job to a human:
#
#   "Then open MuSchG §3, BEEG §7 and BEEG §16 at the cited URLs and confirm the
#    rule text says what the YAML claims"
#
# Until that pass happens, writing a verified_on date would be claiming a
# verification that did not occur — in a product whose entire pitch is
# provenance. Flip each rule to verified_on: <the date you checked it> and
# source_status: verified as you work through them, and reset review_after to
# 365 days from that date.
#
# Offsets marked "practice, not statute" in note_en have no legal deadline behind
# them at all. Those need a judgement call, not a citation.

- id: hebamme_search_start
  track: german
  jurisdiction: federal
  title_en: Start looking for a midwife
  term_de: Hebamme
  anchor: due_date
  window_open:
    offset_days: -224
  deadline:
    offset_days: -168
    kind: advisory
    note_en: >
      Practice, not statute. Your entitlement to midwife care is statutory, but
      nothing in law says when to start looking. Midwives in cities are commonly
      booked out months ahead, which is why this sits early on the timeline.
  authority_en: You find the midwife yourself; your Krankenkasse covers the care
  consequence_en: >
    Leaving it late often means no midwife is available for postnatal home visits,
    which are covered but not guaranteed to exist near you.
  documents:
    - Proof of statutory health insurance
    - Maternity record (Mutterpass), once issued
  source_ref: SGB V §24d
  source_url: https://www.gesetze-im-internet.de/sgb_5/__24d.html
  verified_on: null
  source_status: needs_manual_verification
  review_after: 2027-10-01

- id: mutterschutz_notify_employer
  track: german
  jurisdiction: federal
  title_en: Tell your employer you are pregnant and when the baby is due
  term_de: Mutterschutz
  anchor: due_date
  window_open:
    offset_days: -224
  deadline:
    offset_days: -49
    kind: advisory
    note_en: >
      MuSchG §15 is worded as a duty to inform, not as a cut-off with a penalty.
      Telling the employer is what starts the protection measures and the
      protection against dismissal, so the practical cost of waiting is real even
      though the date is not statutory.
  applies_if:
    all:
      - employment_status: [employed]
  authority_en: Your employer
  consequence_en: >
    Protective measures, the ban on dangerous work and dismissal protection all
    depend on the employer knowing. None of it applies retroactively to a risk you
    were exposed to before you told them.
  documents:
    - Certificate of the expected date of delivery from your doctor or midwife
  source_ref: MuSchG §15
  source_url: https://www.gesetze-im-internet.de/muschg_2018/__15.html
  verified_on: null
  source_status: needs_manual_verification
  review_after: 2027-10-01

- id: mutterschaftsgeld_application
  track: german
  jurisdiction: federal
  title_en: Apply for Mutterschaftsgeld
  term_de: Mutterschaftsgeld
  anchor: due_date
  window_open:
    offset_days: -49
  deadline:
    offset_days: -14
    kind: soft
    note_en: >
      The window opens, it does not run forever. The certificate of the expected
      date of delivery may be issued at the earliest seven weeks before that date,
      and the payment is tied to the protection period that begins six weeks
      before. Applying after the period has started delays money you are already
      entitled to.
  applies_if:
    all:
      - insurance: [gkv]
  authority_en: Your Krankenkasse, plus the employer for their top-up share
  consequence_en: >
    Payment starts when the application and the certificate are in. Late paperwork
    does not reduce the entitlement but it does delay the cash.
  documents:
    - Certificate of the expected date of delivery, issued no earlier than seven weeks before
    - Your Krankenkasse's Mutterschaftsgeld form
  source_ref: SGB V §24i
  source_url: https://www.gesetze-im-internet.de/sgb_5/__24i.html
  verified_on: null
  source_status: needs_manual_verification
  review_after: 2027-10-01

- id: elternzeit_notify_employer
  track: german
  jurisdiction: federal
  title_en: Give your employer written notice of Elternzeit
  term_de: Elternzeit
  anchor: due_date
  window_open:
    offset_days: -112
  deadline:
    offset_days: -49
    kind: hard
    note_en: >
      BEEG §16(1) requires the request to reach the employer at least seven weeks
      before the leave starts, in writing with an original signature — an e-mail
      does not satisfy the form requirement. The seven weeks count back from the
      start of the LEAVE, not from the birth, and this timeline models the
      conservative case where leave begins at the birth. See docs/adr/010.
  applies_if:
    all:
      - employment_status: [employed]
  authority_en: Your employer
  consequence_en: >
    Miss the seven weeks and the start of the leave shifts later, which cascades
    into which months your Elterngeld covers.
  documents:
    - Written request, signed by hand, stating which months of leave you are taking
  source_ref: BEEG §16(1)
  source_url: https://www.gesetze-im-internet.de/beeg/__16.html
  verified_on: null
  source_status: needs_manual_verification
  review_after: 2027-10-01

- id: vaterschaftsanerkennung
  track: german
  jurisdiction: federal
  title_en: Acknowledge paternity, and declare joint custody
  term_de: Vaterschaftsanerkennung
  anchor: due_date
  window_open:
    offset_days: -84
  deadline:
    offset_days: 0
    kind: advisory
    note_en: >
      There is no deadline. It is on the timeline before the birth because doing it
      beforehand is free, quick, and removes a blocker from everything that follows
      on the consular side.
  applies_if:
    all:
      - marital_status: [unmarried]
  authority_en: Jugendamt or Standesamt, or a notary
  consequence_en: >
    Without acknowledgement the partner is not the legal father and is not on the
    birth certificate, which blocks consular birth registration and the child's
    passport. Joint custody needs a separate Sorgeerklärung.
  documents:
    - Passports of both parents
    - Certificate of the expected date of delivery
    - Both parents present, or a notarised declaration
  source_ref: BGB §1592, §1594, §1626a
  source_url: https://www.gesetze-im-internet.de/bgb/__1592.html
  verified_on: null
  source_status: needs_manual_verification
  review_after: 2027-10-01

- id: hospital_registration
  track: german
  jurisdiction: federal
  title_en: Register at the hospital where you plan to give birth
  term_de: Geburtsanmeldung
  anchor: due_date
  window_open:
    offset_days: -140
  deadline:
    offset_days: -42
    kind: advisory
    note_en: >
      Practice, not statute. No law sets a date for this and no law requires it at
      all; hospitals set their own windows and popular units in cities close early.
      Confirm the window with the specific hospital — this offset is a reasonable
      default, not a sourced rule.
  authority_en: The hospital or birth centre you choose
  consequence_en: >
    Registering late can mean your preferred unit is full and you give birth
    somewhere you did not choose.
  documents:
    - Maternity record (Mutterpass)
    - Insurance card
    - Identity document
  source_ref: No statutory basis — hospital practice
  source_url: TBD — no verified source yet
  verified_on: null
  source_status: needs_manual_verification
  review_after: 2027-10-01

- id: standesamt_birth_registration
  track: german
  jurisdiction: federal
  title_en: Register the birth at the Standesamt
  term_de: Standesamt
  anchor: birth
  window_open:
    offset_days: 0
  deadline:
    offset_days: 7
    kind: hard
    note_en: >
      PStG §18 requires notification of the birth within one week. A hospital birth
      is normally notified by the hospital; the parents still collect the
      Geburtsurkunde, and the copies ordered here are what every later application
      needs.
  authority_en: Standesamt of the district where the baby was born
  consequence_en: >
    Nothing downstream can start without the Geburtsurkunde — not Elterngeld, not
    Kindergeld, not the consular registration.
  documents:
    - Parents' passports
    - Marriage certificate, or the acknowledgement of paternity if unmarried
    - Hospital notification of the birth
    - Request several certified copies, with Verwendungszweck noted for each
  source_ref: PStG §18
  source_url: https://www.gesetze-im-internet.de/pstg/__18.html
  verified_on: null
  source_status: needs_manual_verification
  review_after: 2027-10-01

- id: elterngeld_application
  track: german
  jurisdiction: federal
  title_en: Apply for Elterngeld
  term_de: Elterngeld
  anchor: birth
  window_open:
    offset_days: 0
  deadline:
    offset_days: 92
    kind: soft
    note_en: >
      Not a statutory cut-off. Elterngeld is paid at most three months back from
      the month the application arrives, so later applications lose whole months.
      The right itself does not expire on day 93.
  applies_if:
    all:
      - insurance: [gkv]
  authority_en: Elterngeldstelle of your Bundesland
  consequence_en: >
    Each month you apply late beyond the three-month window is a month you cannot
    claim later.
  documents:
    - Birth certificate for Elterngeld purposes (Geburtsurkunde mit Verwendungszweck Elterngeld)
    - Payslips for the twelve months before the birth
    - Confirmation of Mutterschaftsgeld from the Krankenkasse
  source_ref: BEEG §7(1)
  source_url: https://www.gesetze-im-internet.de/beeg/__7.html
  verified_on: null
  source_status: needs_manual_verification
  review_after: 2027-10-01

- id: kindergeld_application
  track: german
  jurisdiction: federal
  title_en: Apply for Kindergeld
  term_de: Kindergeld
  anchor: birth
  window_open:
    offset_days: 0
  deadline:
    offset_days: 183
    kind: soft
    note_en: >
      Not a statutory cut-off. Kindergeld is paid retroactively for a limited number
      of months before the application arrives, so a late application loses the
      months outside that window. Confirm the current retroactivity period — it was
      shortened in recent years and the offset here reflects six months.
  authority_en: Familienkasse of the Bundesagentur für Arbeit
  consequence_en: >
    Months outside the retroactivity window are lost permanently, even though the
    entitlement itself continues.
  documents:
    - Birth certificate for Kindergeld purposes
    - The child's tax identification number, which arrives by post after registration
    - Kindergeld application form
  source_ref: EStG §66(3)
  source_url: https://www.gesetze-im-internet.de/estg/__66.html
  verified_on: null
  source_status: needs_manual_verification
  review_after: 2027-10-01

- id: baby_health_insurance
  track: german
  jurisdiction: federal
  title_en: Add the baby to your health insurance
  term_de: Familienversicherung
  anchor: birth
  window_open:
    offset_days: 0
  deadline:
    offset_days: 60
    kind: soft
    note_en: >
      Family cover for a newborn is free and normally applies from the day of birth
      when registered promptly. The offset here is a practical window, not a
      statutory one — confirm the registration deadline with your own Krankenkasse,
      because the consequence of a gap is medical bills.
  applies_if:
    all:
      - insurance: [gkv]
  authority_en: Your Krankenkasse
  consequence_en: >
    An unregistered newborn can end up without cover for the first weeks, including
    the U-examinations, and the bills land on you.
  documents:
    - Birth certificate
    - Your insurance details
    - The Krankenkasse's Familienversicherung form
  source_ref: SGB V §10
  source_url: https://www.gesetze-im-internet.de/sgb_5/__10.html
  verified_on: null
  source_status: needs_manual_verification
  review_after: 2027-10-01
