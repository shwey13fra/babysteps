    domain: familienportal.de
    content_selector: "main"
    urls:
      - https://familienportal.de/familienportal/familienleistungen/elterngeld
      - https://familienportal.de/familienportal/familienleistungen/elterngeld/faq
      - https://familienportal.de/familienportal/familienleistungen/elterngeld/familiensituation
      - https://familienportal.de/familienportal/familienleistungen/elterngeld/arbeitssituation
      - https://familienportal.de/familienportal/familienleistungen/elternzeit
      - https://familienportal.de/familienportal/familienleistungen/elternzeit/arbeit-versicherung
      - https://familienportal.de/familienportal/familienleistungen/elternzeit/faq
      - https://familienportal.de/familienportal/familienleistungen/kindergeld
      - https://familienportal.de/familienportal/familienleistungen/kindergeld/familiensituation
      - https://familienportal.de/familienportal/familienleistungen/kindergeld/faq
      - https://familienportal.de/familienportal/familienleistungen/mutterschutz
      - https://familienportal.de/familienportal/lebenslagen/schwangerschaft-geburt
      - https://familienportal.de/familienportal/lebenslagen/schwangerschaft-geburt/staatliche-leistungen
      - https://familienportal.de/familienportal/lebenslagen/schwangerschaft-geburt/anmeldung-standesamt
      - https://familienportal.de/familienportal/lebenslagen/schwangerschaft-geburt/vaterschaftanerkennung
      - https://familienportal.de/familienportal/lebenslagen/schwangerschaft-geburt/namensrecht-sorgerecht
      - https://familienportal.de/familienportal/lebenslagen/schwangerschaft-geburt/fruehgeborene
      - https://familienportal.de/familienportal/lebenslagen/schwangerschaft-geburt/zwillinge-mehrlinge
      - https://familienportal.de/familienportal/lebenslagen/schwangerschaft-geburt/gesundheit-und-beratung
      - https://familienportal.de/familienportal/lebenslagen/schwangerschaft-geburt/checklisten
      - https://familienportal.de/familienportal/lebenslagen/schwangerschaft-geburt/fruehe-hilfen
    fetch: auto
    robots: { allows: true, rule: "Disallow: (empty)", checked: 2026-10-22 }

  - id: familienkasse
    format: html
    domain: www.arbeitsagentur.de
    content_selector: "main"
    urls:
      - https://www.arbeitsagentur.de/familie-und-kinder/infos-rund-um-kindergeld
      - https://www.arbeitsagentur.de/ueber-uns/familienkasse-der-ba
      - https://www.arbeitsagentur.de/familie-und-kinder/infos-rund-um-kindergeld/nachweise-einreichen
    fetch: auto
    robots: { allows: true, rule: "Disallow: (empty) + Allow: /", checked: 2026-10-22 }

  - id: gba_kinder_richtlinie
    format: html
    domain: www.g-ba.de
    content_selector: "main"
    urls:
      - https://www.g-ba.de/richtlinien/15/
    fetch: auto
    robots: { allows: true, rule: "only /styleguide/ and /sys/suche disallowed", checked: 2026-10-22 }

  - id: berlin_service
    jurisdiction: berlin
    format: html
    domain: service.berlin.de
    content_selector: "#layout-grid__area--maincontent"
    urls:
      - https://service.berlin.de/dienstleistung/326079/
      - https://service.berlin.de/dienstleistung/318957/
      - https://service.berlin.de/dienstleistung/318960/
    fetch: auto
    # NOTE: PDF paths are disallowed. HTML pages only.
    robots: { allows: true, rule: "Disallow: /dienstleistung/*/pdf/ and similar — HTML permitted, PDF NOT", checked: 2026-10-22 }

  - id: hessen_rp
    jurisdiction: hesse
    format: html
    domain: rp-giessen.hessen.de
    content_selector: "main"
    urls:
      - https://rp-giessen.hessen.de/Elterngeld
    fetch: auto
    robots: { allows: true, rule: "infrastructure paths only (/core/, /admin/, …); content permitted", checked: 2026-10-22 }

  - id: frankfurt_standesamt
    jurisdiction: hesse
    format: html
    domain: www.frankfurt.de
    urls: []
    fetch: manual
    # CORRECTED 2026-10-22 (ADR-016). robots.txt reads "User-agent: * / allow: /" - it
    # permits everything. The earlier "403 unverifiable" came from a probe sent with no
    # User-Agent. But the site's bot protection returns 403 to our client for robots.txt
    # and content alike, under every header combination tried. Unfetchable, not forbidden.
    # We will not spoof a browser fingerprint to get around an access control.
    robots: { allows: true, rule: "User-agent: * / allow: /", checked: 2026-10-22 }
    blocked_by: bot-protection-403

  # ---- Consular India. NEVER auto-fetched. ----

  - id: cgi_frankfurt
    jurisdiction: consular-india
    track: consular
    format: html
    domain: www.cgifrankfurt.gov.in
    urls: []
    fetch: manual
    manual_review: true
    review_after_days: 90
    # robots.txt contains "User-agent: * / Disallow: /". Automated fetching is forbidden
    # outright. This text must be curated by hand or not ingested at all.
    robots: { allows: false, rule: "User-agent: * / Disallow: /", checked: 2026-10-22 }

  - id: indian_embassy_berlin
    jurisdiction: consular-india
    track: consular
    format: html
    domain: www.indianembassyberlin.gov.in
    urls: []
    fetch: manual
    manual_review: true
    review_after_days: 90
    # CORRECTED 2026-10-22 (ADR-016). Not a permission question: the host itself is gone.
    # https://www.indianembassyberlin.gov.in/ returns 404 and robots.txt 404s via /error.
    # Needs the mission's current official URL, which must be confirmed by a human.
    robots: { allows: unknown, rule: "host returns 404 - site moved or retired", checked: 2026-10-22 }
    blocked_by: host-404
