# data/corpus_manifest.yaml
#
# Drives scripts/ingest. One entry per source. Nothing is fetched that is not listed here.
#
# robots: every entry records the robots.txt verdict AND the date it was read. ADR-013 requires
# the date; an undated robots claim is what ADR-012 got wrong. Re-read before any later ingest.
#
# fetch: auto     - scripts/ingest/fetch.ts may download it
#        manual   - a human curates the text; the fetcher must skip it, always
#
# Statutes are authoritative and structurally parseable (XML <norm>/<enbez>), so they carry
# section_ref directly. HTML sources are explanatory, not statute, and their chunks get
# section_ref: null - which is why the Phase 2 gate only requires non-null section_ref on
# statute text.

version: 1
corpus_version: "2026-10"

defaults:
  track: german
  jurisdiction: federal
  review_after_days: 365

sources:

