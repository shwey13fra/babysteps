    fetch: manual
    # CORRECTED 2026-10-22 (ADR-016). robots.txt reads "User-agent: * / allow: /" - it
    # permits everything. The earlier "403 unverifiable" came from a probe sent with no
    # User-Agent. But the site's bot protection returns 403 to our client for robots.txt
    # and content alike, under every header combination tried. Unfetchable, not forbidden.
    # We will not spoof a browser fingerprint to get around an access control.
    robots: { allows: true, rule: "User-agent: * / allow: /", checked: 2026-10-22 }
    content_signal: { present: true, signal: "search=yes,ai-train=no,use=reference", ai_input: unspecified,
